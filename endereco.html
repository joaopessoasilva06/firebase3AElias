<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
    <style>
        fieldset{
            background-color: rgb(182, 216, 221);
            text-align: left;
            width: 600px;
        }
        .direita{
            text-align: right;
        }
        .input{
            margin-left: 100px;
        }
    </style>
</head>
<body>
    <fieldset>
        <form id="formulario">
            <legend>Endereço</legend>
            <p>CEP:<input id="cep" class="input" type="text"></p>
            <p>Endereço:<input id="endereco" class="input" type="text"></p>
            <p>Complemento:<input id="complemento" class="input" type="text">
            Bairro:<input id="bairro" class="" type="text"></p>
            <p>Cidade:<input id="cidade" class="input" type="text"></p>
            <p class="direita">Telefone1:<input id="telefone1" class="input" type="text">
            Complemento1:<input id="complemento1" class="" type="text"></p>
            <p class="direita">Telefone2:<input id="telefone2" class="input" type="text">
            Complemento2:<input id="complemento2" class="" type="text"></p>
            <p class="direita">Celular:<input id="celular" class="input" type="text">
            Complemento3:<input id="complemento3" class="" type="text"></p>
            <p class="direita">Fax:<input id="fax" class="input" type="text">
            Complemento4:<input id="complemento4" class="" type="text"></p>
            <input type="submit" value="Cadastrar">
        </form>
    </fieldset>
</body>
</html>
